name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "!.changeset/README.md"
      - "!.changeset/config.json"

jobs:
  release:
    name: Release NPM and JSR
    if: github.repository == 'eryue0220/unplugin-stylex'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: eryue0220
          cache: "pnpm"

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run changeset:version
          commit-message: "chore: Update version for release"
          pr-title: "chore: Update version for release"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (Trusted Publishing)
        if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm run changeset:release

      - name: Publish to JSR
        if: steps.changesets.outputs.has-changesets == 'false'
        run: pnpm run jsr
